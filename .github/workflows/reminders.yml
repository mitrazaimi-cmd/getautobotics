# Free scheduler for consultation reminders (works with any host, including Vercel Hobby).
# Setup: GitHub repo → Settings → Secrets and variables → Actions → add
#   SITE_URL     e.g. https://getautobotics.com
#   CRON_SECRET  same value as the CRON_SECRET environment variable of the site
# GitHub may delay scheduled runs by a few minutes; the reminder logic tolerates that.

name: Consultation reminders

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call reminders endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL or CRON_SECRET secret not set — skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/reminders"
